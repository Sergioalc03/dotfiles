# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# MPV: reproductor de vídeo y audio
# La interfaz es uosc (~/.config/mpv/scripts/uosc, la instala
# install.sh; no está en el repo). Sus ajustes y colores están en
# script-opts/uosc.conf, que genera wallust al cambiar de fondo.
# Teclas: clic derecho = menú, espacio = pausa, f = pantalla
# completa, ←/→ = 5 s, ↑/↓ = 1 min, s = captura.
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --

# uosc dibuja sus propios controles: quitar los de mpv
osc=no
osd-bar=no
border=no

# Vídeo: decodificación por hardware (gráfica Intel) si es segura
vo=gpu-next
hwdec=auto-safe

# Seguir donde lo dejaste y no cerrar al terminar
save-position-on-quit
keep-open=yes

# Audio y subtítulos en español si los hay
alang=spa,es,esp,eng,en
slang=spa,es,esp,eng,en
sub-auto=fuzzy

# Volumen al abrir y máximo (con 130 % se puede subir algo más)
volume=70
volume-max=130

# Capturas (tecla s) junto a las de screenshot.sh
screenshot-directory=~/Imágenes/Capturas
screenshot-format=png
