# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# KITTY
# https://sw.kovidgoyal.net/kitty/conf/
# Recargar sin cerrar: CTRL + SHIFT + F5
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --

# FUENTE
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# CURSOR
cursor_shape          beam
cursor_blink_interval 0.5
cursor_trail          1

# SCROLL
scrollback_lines           10000
# Abre el historial completo en un paginador: CTRL + SHIFT + H
scrollback_pager_history_size 10

# RATÓN
copy_on_select     clipboard
strip_trailing_spaces smart
url_style          curly
show_hyperlink_targets yes

# VENTANA
window_padding_width   10
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell      no
visual_bell_duration   0

# Transparencia (el blur lo pone Hyprland)
background_opacity 0.92

# PESTAÑAS (CTRL + SHIFT + T nueva, CTRL + SHIFT + Q cerrar)
tab_bar_edge         bottom
tab_bar_style        powerline
tab_powerline_style  slanted
tab_title_template   "{index}: {title}"

# ATAJOS EXTRA
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd

# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# COLORES: Tokyo Night
# Para probar otros temas: kitty +kitten themes
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
foreground            #c0caf5
background            #1a1b26
selection_foreground  #c0caf5
selection_background  #283457
cursor                #c0caf5
cursor_text_color     #1a1b26
url_color             #73daca

active_border_color   #7aa2f7
inactive_border_color #292e42

active_tab_foreground   #16161e
active_tab_background   #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #292e42
tab_bar_background      #15161e

