# Generado por wallust (templates/tmux.conf). NO editar: se
# sobrescribe al cambiar de fondo. Lo carga tmux.conf.

set -g status-style "bg={{background}},fg={{foreground | blend(background) | lighten(0.2)}}"
set -g status-left "#[bg={{color4}},fg={{background}},bold] #S #[default] "
set -g status-right "#[fg={{foreground | blend(background)}}]%H:%M "
setw -g window-status-current-format "#[bg={{background | lighten(0.12)}},fg={{color4}},bold] #I:#W "
set -g pane-border-style "fg={{background | lighten(0.12)}}"
set -g pane-active-border-style "fg={{color4}}"
set -g message-style "bg={{background | lighten(0.12)}},fg={{foreground}}"
