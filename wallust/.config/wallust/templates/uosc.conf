# Generado por wallust (templates/uosc.conf). NO editar: se
# sobrescribe al cambiar de fondo. Lo lee uosc al abrir mpv.
# Todas las opciones: https://github.com/tomasklaen/uosc/blob/main/src/uosc.conf

# Barra de progreso más visible y que no tapa el vídeo en pausa
timeline_style=bar
timeline_size=30
progress=windowed

# Menús en español
languages=es,en

# Colores del fondo de pantalla (hex sin #)
color=foreground={{color4 | strip}},foreground_text={{background | strip}},background={{background | strip}},background_text={{foreground | strip}},curtain={{background | darken(0.3) | strip}},success={{color2 | strip}},error=f7768e,match={{color6 | strip}}
border_radius=6
