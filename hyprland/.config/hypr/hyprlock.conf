# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# HYPRLOCK - pantalla de bloqueo (SUPER + L)
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# Atajos para borrar la contraseña: ESC, Ctrl+U, Ctrl+Backspace

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled   = true
    bezier    = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Fondo: captura de la pantalla actual, difuminada
background {
    monitor =
    path        = screenshot
    blur_passes = 3
    blur_size   = 8
    brightness  = 0.5
}

# Tema Tokyo Night: mismos colores que el borde de ventana activa (appearance.lua)
input-field {
    monitor =
    size              = 20%, 5%
    outline_thickness = 3
    inner_color       = rgba(1a1b26aa)

    outer_color = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    check_color = rgba(9ece6aee) rgba(73dacaee) 120deg
    fail_color  = rgba(f7768eee) rgba(ff9e64ee) 40deg

    font_color       = rgb(c0caf5)
    fade_on_empty    = false
    rounding         = 15
    font_family      = $font
    placeholder_text = Contraseña...
    fail_text        = $PAMFAIL
    dots_spacing     = 0.3

    position = 0, -20
    halign   = center
    valign   = center
}

# HORA
label {
    monitor =
    text        = $TIME
    color       = rgb(c0caf5)
    font_size   = 90
    font_family = $font
    position    = 0, 200
    halign      = center
    valign      = center
}

# FECHA (en español gracias al locale)
label {
    monitor =
    text        = cmd[update:60000] date +"%A, %d de %B"
    color       = rgb(7aa2f7)
    font_size   = 22
    font_family = $font
    position    = 0, 110
    halign      = center
    valign      = center
}

# USUARIO
label {
    monitor =
    text        =   $USER
    color       = rgb(a9b1d6)
    font_size   = 14
    font_family = $font
    position    = 0, -90
    halign      = center
    valign      = center
}
