# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# HYPRIDLE - qué pasa cuando no tocas el PC
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# OJO: hypridle/hyprlock siguen usando hyprlang (.conf),
# no Lua como Hyprland.
# Se lanza desde autostart.lua. El módulo "idle_inhibitor"
# de Waybar lo pausa (p. ej. viendo una peli).

general {
    lock_cmd         = pidof hyprlock || hyprlock                      # no abrir dos hyprlock
    before_sleep_cmd = loginctl lock-session                           # bloquear antes de suspender
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # encender pantalla al volver
}

# 2.5 min: bajar el brillo
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 5 min: bloquear
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: apagar pantalla
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 15 min: suspender, solo si vas con batería
listener {
    timeout    = 900
    on-timeout = [ "$(cat /sys/class/power_supply/ACAD/online)" = 0 ] && systemctl suspend
}

# 30 min: suspender (enchufado)
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
