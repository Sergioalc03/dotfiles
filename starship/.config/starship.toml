# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# STARSHIP - prompt de la terminal
# https://starship.rs/config/
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# Colores: nombres ANSI (blue, purple...) = la paleta de kitty, que
# genera wallust a partir del fondo; cambian al cambiar de fondo.
# Solo el error es rojo fijo, para que siempre signifique error.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
$username$hostname$directory$git_branch$git_status$python$nodejs$rust$cmd_duration
$character"""

[username]
show_always = false          # solo por SSH o como root
format = '[$user]($style)@'

[hostname]
ssh_only = true
format = '[$hostname]($style) '

[directory]
style = 'bold blue'
truncation_length = 3
truncate_to_repo = true
read_only = ' 󰌾'

[directory.substitutions]
'Descargas' = '󰉍 '
'Imágenes' = '󰉏 '
'dotfiles' = ' dotfiles'

[git_branch]
symbol = ' '
style = 'bold purple'

[git_status]
style = 'yellow'

[cmd_duration]
min_time = 2000               # mostrar si tarda más de 2 s
format = '[ $duration]($style) '
style = 'bright-black'

[character]
success_symbol = '[❯](bold green)'
error_symbol   = '[❯](bold #f7768e)'

[python]
symbol = ' '

[nodejs]
symbol = ' '

[rust]
symbol = ' '
