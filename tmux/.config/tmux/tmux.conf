# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# TMUX
# Prefijo: CTRL + a (en vez de CTRL + b)
# Recargar: prefijo + r
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Dividir en la carpeta actual:  prefijo + |  /  prefijo + -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Moverse entre paneles con ALT + flechas (sin prefijo)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux recargado"

# Copiar estilo vi y al portapapeles de Wayland
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Barra de estado. Colores: Tokyo Night por si falta colores.conf;
# colores.conf (generado por wallust, wallust/templates/tmux.conf) los
# sustituye por los del fondo. wallpaper.sh lo recarga en vivo.
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left "#[bg=#7aa2f7,fg=#16161e,bold] #S #[default] "
set -g status-right "#[fg=#545c7e]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#292e42,fg=#7aa2f7,bold] #I:#W "
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#292e42,fg=#c0caf5"
source-file -q ~/.config/tmux/colores.conf
